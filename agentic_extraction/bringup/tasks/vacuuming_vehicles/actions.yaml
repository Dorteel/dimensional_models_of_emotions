drive:
  intent: "Robot moves its base from one location to another."
  requires_capabilities: [navigation]

pick:
  intent: "Robot acquires physical hold of an item."
  requires_capabilities:
    any_of: [grasping, manipulation]

clean:
  intent: "Robot cleans a surface that is covered by a residue, using a cleaning tool it is holding, leaving the surface no longer covered. The robot only needs to be holding the tool and be at the surface's location; the held tool does not need its own location. The surface is the object being cleaned; the residue is what is removed. Cleaning only removes the covered relation and does not move any object."
  requires_capabilities: [manipulation]
